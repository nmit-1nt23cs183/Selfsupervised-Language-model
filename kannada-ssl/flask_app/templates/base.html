<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KannadaSSL — Language, in your words</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23eee8f8'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='36' fill='%2361527e'%3Eಕ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600&family=Noto+Sans+Oriya:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Gurmukhi:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <span class="brand-kannada">ಕ</span>
        <span>Kannada<b>SSL</b></span>
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="primaryNavigation" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="primaryNavigation">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Translator</a>
        <a href="/speech-to-speech" class="nav-link {% if request.path == '/speech-to-speech' %}active{% endif %}">Speech to Speech</a>
        <a href="/chatbot" class="nav-link {% if request.path == '/chatbot' %}active{% endif %}">AI Chatbot</a>
      </div>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <p>KannadaSSL · A calm place to move between languages.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
