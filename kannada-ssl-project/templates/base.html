<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ಕನ್ನಡ SSL — Kannada Language Translator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">
        <span class="brand-kannada">ಕ</span>
        <span>Kannada<b>SSL</b></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Translator</a>
        <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">About</a>
      </div>
    </div>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <p>Self-Supervised Learning for Low-Resource Kannada Language Processing &nbsp;·&nbsp; AIML Research Project</p>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
